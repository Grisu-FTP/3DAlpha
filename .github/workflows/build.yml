# Runs the host unit suite and then builds a .3dsx and a .cia for every version
# manifest in versions/. Both fan out over the same matrix, so adding a manifest
# adds a test run and a build with no edit here.
#
# The tests gate the binaries: a red suite for any version produces no artifacts
# at all. That is deliberate -- an artifact that boots but silently broke shared
# world or entity code for another version is worse than no artifact.
#
# Artifacts are named 3DAlphaR<n><version>, e.g. 3DAlphaR1a1.1.2.3dsx -- <n> is
# this workflow's run number, which increments on every push. Nothing else in
# the build carries it: the SMDH title, the product code and the UniqueId all
# stay per-version, so an R42 CIA installs over an R41 CIA rather than beside
# it, which is what you want from a build number.
#
# On main, the run then publishes a release tagged R<n> carrying every version's
# binaries and an FBI-scannable QR per version, so a console can install without
# a PC. See docs/build-versions.md.
name: build

on:
  push:
  workflow_dispatch:

# A second push to the same branch makes the first build's binaries stale
# before they finish, so drop them.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version list is versions/*.json and nothing else, so adding a manifest
  # adds a build with no edit here. A matrix has to exist before the job it
  # feeds starts, which is why this is its own job rather than a step.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          matrix=$(basename -s .json -a versions/*.json | jq -R . | jq -sc .)
          echo "versions: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The host unit suite, once per version manifest.
  #
  # This job is the thing that makes configure-time version selection safe to
  # extend. The argument for it over one fork per version is that shared code
  # stays checked against *every* version on every push -- and compiling only
  # proves the code parses. Running the suite is what proves that a change made
  # for one version did not quietly alter entity, world, net or tick behaviour
  # for the others. Without this the answer arrives on a console, by hand, weeks
  # later. See docs/build-versions.md.
  #
  # `src/core/` is platform-independent by construction (docs/architecture.md),
  # so none of this needs devkitARM or a console -- an ordinary runner with a
  # compiler builds it. The 3DS jobs below wait on it.
  test:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # zlib is required outright (chunk files are gzip, Map Chunk payloads are
      # zlib). libvorbis is not: without it the host build sets MC_HAVE_VORBIS=0
      # and the audio layer compiles to stubs that never open anything.
      #
      # It is installed anyway, and deliberately. A skipped test is not a
      # passing test -- a runner with no decoder would quietly cover less than
      # the machine the developer runs `build-host` on, which is the one thing
      # this job exists to prevent. `vorbisfile.pc`, which the host branch of
      # CMakeLists probes for, comes from libvorbis-dev.
      - name: Ensure zlib and libvorbis headers are present
        run: |
          missing=""
          pkg-config --exists zlib      || missing="$missing zlib1g-dev"
          pkg-config --exists vorbisfile || missing="$missing libvorbis-dev"
          if [ -n "$missing" ]; then
            sudo apt-get update
            sudo apt-get install -y $missing
          fi
          # Fails the job rather than letting the build silently drop audio.
          pkg-config --modversion zlib vorbisfile

      # Debug with SANITIZE=ON, matching the build-host configuration the
      # working guide tells contributors to use, so a failure here reproduces
      # locally with the same command rather than only under CI's flags.
      #
      # ASan/UBSan are the entire point of the host target -- a bounds bug in
      # the NBT parser is an unexplained crash on hardware and a diagnosed line
      # here -- and the CMakeLists attaches them PUBLIC on 3dalpha_core so the
      # code under test carries them, not just the test files. They cost build
      # and run time; that is the trade this job exists to make.
      - name: Configure host build
        run: |
          cmake -S . -B "build-ci-host/${{ matrix.version }}" \
            -DMCVER="${{ matrix.version }}" -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON

      - name: Build tests
        run: |
          cmake --build "build-ci-host/${{ matrix.version }}" \
            --target 3dalpha_tests -j"$(nproc)"

      # The binary is run directly rather than through ctest: `add_test` wraps
      # the whole suite as a single test, so ctest reports one pass or one
      # failure, while the binary names the case that failed and prints the
      # counts. Its exit status is what fails the job.
      - name: Run tests
        run: |
          set -o pipefail
          "./build-ci-host/${{ matrix.version }}/3dalpha_tests" 2>&1 | tee test.log

      # Runs on failure too -- the tail is the useful part when it is red.
      - name: Report results
        if: always()
        run: |
          {
            echo "### ${{ matrix.version }} host tests"
            echo '```'
            tail -n 20 test.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [versions, test]
    runs-on: ubuntu-latest
    # devkitARM, libctru, citro3d, citro2d, picasso, 3dsxtool and 3ds-zlib all
    # come with the image; Debian 12 underneath supplies python3 and cmake.
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # actions/checkout leaves the workspace owned by a different uid than the
      # container's root, which git refuses to operate on without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # devkitPro does not ship makerom (see docs/toolchain-setup.md), and the
      # prebuilt release binary is linked against glibc 2.38 while this image is
      # Debian 12 (2.36) -- so it is built from source at a pinned tag. It takes
      # about two seconds.
      - name: Build makerom
        run: |
          git clone --depth 1 --branch makerom-v0.19.0 \
            https://github.com/3DSGuy/Project_CTR.git /tmp/project_ctr
          make -C /tmp/project_ctr/makerom deps -j"$(nproc)"
          make -C /tmp/project_ctr/makerom -j"$(nproc)"
          install -m755 /tmp/project_ctr/makerom/bin/makerom /usr/local/bin/makerom
          makerom 2>&1 | head -2 || true

      # The HOME Menu art. Pillow draws the icon and the banner image
      # (tools/make_packaging_art.py) and bannertool wraps the latter into the
      # CBMD makerom wants. Both are optional to CMake -- it falls back to
      # devkitPro's default icon and a bannerless CIA -- which is exactly why
      # they are asserted here: a release artifact that quietly reverts to the
      # default homebrew icon and a blank top screen is the bug this installs
      # them to prevent, and it is invisible until someone installs the CIA.
      #
      # bannertool, like makerom, is not in the image -- but unlike makerom it is
      # taken from its release rather than built. The original Steveice10 repo
      # is gone; `Epicpkmn11/bannertool` is the maintained fork, and it is the
      # same v1.2.0 binary, from the same place `tools/fetch-cia-tools.sh`-style
      # setups already use. **Its prebuilt Linux binary needs at most GLIBC_2.14
      # and this image has 2.36**, which is the measurement that makes
      # downloading safe here where it was not for makerom (2.38 against 2.36).
      - name: Install the art tools
        run: |
          apt-get update -qq
          # fonts-dejavu-core is not optional. The image ships no fonts at
          # all, Pillow then falls back to a face it cannot scale, and the
          # banner's title came out of the resize as a single dash -- which
          # is what shipped. AlphaU draws with DejaVu Sans Bold, so installing
          # it is also what keeps the two consoles' art identical.
          apt-get install -y --no-install-recommends \
            python3-pil fonts-dejavu-core curl unzip ca-certificates
          curl -fsSL --retry 3 -o /tmp/bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -qo /tmp/bannertool.zip -d /tmp/bannertool
          install -m755 /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          # Asserted by testing the file, not by running it: bannertool prints
          # its usage and exits 255 when given no arguments, so its exit status
          # says nothing about whether it works.
          test -x /usr/local/bin/bannertool
          bannertool 2>&1 | head -1 || true

      # A build with no Vorbis decoder still succeeds and the console is simply
      # silent -- audio is never a startup dependency, see docs/assets.md -- so
      # the failure mode this step guards against is a quietly mute artifact,
      # not a broken compile. That is why it ends in `test -f`: the assertion is
      # the point, and it is what fails the run.
      #
      # The install is only a fallback. devkitpro/devkitarm:latest already ships
      # 3ds-libvorbisidec and 3ds-libogg, and pkg.devkitpro.org sits behind
      # Cloudflare, which answers Actions runners with a 403 often enough that
      # an unconditional `dkp-pacman -Sy` was failing builds that had both
      # libraries all along.
      - name: Ensure the Vorbis decoder is present
        run: |
          libs="$DEVKITPRO/portlibs/3ds/lib"
          if [ -f "$libs/libvorbisidec.a" ] && [ -f "$libs/libogg.a" ]; then
            echo "3ds-libvorbisidec and 3ds-libogg are already in the image"
          else
            dkp-pacman -Sy --noconfirm --needed 3ds-libvorbisidec
          fi
          test -f "$libs/libvorbisidec.a"
          test -f "$libs/libogg.a"

      # Not `make VERSION=...`: the Makefile builds into build/<version>/, and
      # that directory is committed to the repo with a CMakeCache.txt full of
      # absolute paths from a developer's machine. CMake would refuse it.
      - name: Configure
        run: |
          "$DEVKITPRO/portlibs/3ds/bin/arm-none-eabi-cmake" \
            -S . -B "build-ci/${{ matrix.version }}" \
            -DMCVER="${{ matrix.version }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build 3DSX
        run: cmake --build "build-ci/${{ matrix.version }}" -j"$(nproc)"

      # Separate target, and it does not imply the 3dsx -- both are built.
      - name: Build CIA
        run: cmake --build "build-ci/${{ matrix.version }}" --target cia

      # The icon and the banner are the two things a CIA can lose silently: it
      # installs and runs either way, and the only symptom is the default
      # homebrew icon on the grid and a blank top screen. Neither is worth
      # finding out about on a console, so both are asserted on the artifacts.
      # **The icon is checked in the SMDH, not in the PNG beside it.** An
      # earlier version of this step confirmed only that `art/icon.png` had
      # been drawn, which proves Pillow ran and nothing else: the icon still
      # has to survive smdhtool, and when it did not what shipped was
      # devkitPro's default -- a picture of a red 3DS -- which installs, runs
      # and looks deliberate. tools/check_smdh.py reads the icons back out of
      # the SMDH the way the console does.
      - name: Check the icon and banner made it in
        run: |
          base="build-ci/${{ matrix.version }}"
          cia="$base/3DAlpha-${{ matrix.version }}.cia"
          smdh="$base/3DAlpha-${{ matrix.version }}.smdh"
          test -s "$smdh"
          python3 tools/check_smdh.py "$smdh" \
            --default "$DEVKITPRO/libctru/default_icon.png"
          grep -qa CBMD "$cia" || { echo "CIA has no banner"; exit 1; }
          echo "icon drawn into the SMDH, banner embedded in the CIA"

      # A 3DSX Luma's loader would reject is indistinguishable on hardware from
      # a crash, so the file is checked here rather than on the console.
      - name: Check the 3DSX would load
        run: python3 tools/check3dsx.py "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.3dsx"

      # docs/build-versions.md asks for this: cross-version code growth should
      # be a number in the build log, not a surprise on a console with 64 MB.
      - name: Report code size
        run: |
          {
            echo "### ${{ matrix.version }} sections"
            echo '```'
            "$DEVKITARM/bin/arm-none-eabi-size" -A -d \
              "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.elf" \
              | grep -E "^(section|\.text|\.rodata|\.data|\.bss|Total)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the build
        id: name
        run: |
          name="3DAlphaR${{ github.run_number }}${{ matrix.version }}"
          mkdir -p dist
          cp "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.3dsx" "dist/$name.3dsx"
          cp "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.cia"  "dist/$name.cia"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name"
            echo '```'
            (cd dist && sha256sum "$name.3dsx" "$name.cia")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/${{ steps.name.outputs.name }}.3dsx
            dist/${{ steps.name.outputs.name }}.cia
          if-no-files-found: error

  # One release per push to main, tagged R<n>, holding every version at once.
  #
  # Artifacts are the wrong delivery mechanism for a console: they are zipped
  # (so FBI cannot fetch one), they expire, and they need a signed-in GitHub
  # session to download at all. A release asset is a plain, permanent, public
  # URL, which is the one thing FBI's Remote Install needs -- so each version
  # also gets a QR of its own .cia URL and installs with no PC in the loop.
  #
  # Main only. A release is a public, permanent tag; branch pushes still build
  # and test above, they just do not publish.
  release:
    needs: [versions, test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Narrower than the default token: this job writes tags and releases and
    # needs nothing else.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Every version's build, flattened into one directory. The build job
      # uploads one artifact per version, all named 3DAlphaR<n><version>.
      - name: Collect every version's binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 3DAlphaR${{ github.run_number }}*
          merge-multiple: true

      - name: Install qrencode
        run: sudo apt-get update && sudo apt-get install -y qrencode

      # Writes dist/qr-<version>.png and the release body. The QR encodes the
      # asset URL this run is about to create -- see tools/release_assets.py for
      # why predicting it is sound.
      - name: Build QR codes and release notes
        run: |
          python3 tools/release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "R${{ github.run_number }}" \
            --dir dist \
            --notes notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Re-running a failed workflow reuses its run number, so the tag may
      # already exist. Replacing it keeps a re-run idempotent instead of
      # failing on the tag; `--cleanup-tag` removes the tag too, so the new
      # release points at the commit this run actually built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="R${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists (re-run); replacing it"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            dist/*.cia dist/*.3dsx dist/*.png

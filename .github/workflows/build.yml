# Runs the host unit suite and then builds a .3dsx and a .cia for every version
# manifest in versions/. Both fan out over the same matrix, so adding a manifest
# adds a test run and a build with no edit here.
#
# The tests gate the binaries: a red suite for any version produces no artifacts
# at all. That is deliberate -- an artifact that boots but silently broke shared
# world or entity code for another version is worse than no artifact.
#
# Artifacts are named 3DAlphaR<n><version>, e.g. 3DAlphaR1a1.1.2.3dsx -- <n> is
# this workflow's run number, which increments on every push. Nothing else in
# the build carries it: the SMDH title, the product code and the UniqueId all
# stay per-version, so an R42 CIA installs over an R41 CIA rather than beside
# it, which is what you want from a build number.
name: build

on:
  push:
  workflow_dispatch:

# A second push to the same branch makes the first build's binaries stale
# before they finish, so drop them.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version list is versions/*.json and nothing else, so adding a manifest
  # adds a build with no edit here. A matrix has to exist before the job it
  # feeds starts, which is why this is its own job rather than a step.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          matrix=$(basename -s .json -a versions/*.json | jq -R . | jq -sc .)
          echo "versions: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The host unit suite, once per version manifest.
  #
  # This job is the thing that makes configure-time version selection safe to
  # extend. The argument for it over one fork per version is that shared code
  # stays checked against *every* version on every push -- and compiling only
  # proves the code parses. Running the suite is what proves that a change made
  # for one version did not quietly alter entity, world, net or tick behaviour
  # for the others. Without this the answer arrives on a console, by hand, weeks
  # later. See docs/build-versions.md.
  #
  # `src/core/` is platform-independent by construction (docs/architecture.md),
  # so none of this needs devkitARM or a console -- an ordinary runner with a
  # compiler builds it. The 3DS jobs below wait on it.
  test:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # `find_package(ZLIB REQUIRED)` is the host build's only external
      # dependency (chunk files are gzip, Map Chunk payloads are zlib). The
      # runner image ships zlib1g-dev, so this is a guard against an image
      # change rather than a routine install -- hence the check first, which
      # keeps the usual run at a second or so.
      - name: Ensure zlib headers are present
        run: |
          if ! pkg-config --exists zlib; then
            sudo apt-get update && sudo apt-get install -y zlib1g-dev
          fi
          pkg-config --modversion zlib

      # Debug with SANITIZE=ON, matching the build-host configuration the
      # working guide tells contributors to use, so a failure here reproduces
      # locally with the same command rather than only under CI's flags.
      #
      # ASan/UBSan are the entire point of the host target -- a bounds bug in
      # the NBT parser is an unexplained crash on hardware and a diagnosed line
      # here -- and the CMakeLists attaches them PUBLIC on 3dalpha_core so the
      # code under test carries them, not just the test files. They cost build
      # and run time; that is the trade this job exists to make.
      - name: Configure host build
        run: |
          cmake -S . -B "build-ci-host/${{ matrix.version }}" \
            -DMCVER="${{ matrix.version }}" -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON

      - name: Build tests
        run: |
          cmake --build "build-ci-host/${{ matrix.version }}" \
            --target 3dalpha_tests -j"$(nproc)"

      # The binary is run directly rather than through ctest: `add_test` wraps
      # the whole suite as a single test, so ctest reports one pass or one
      # failure, while the binary names the case that failed and prints the
      # counts. Its exit status is what fails the job.
      - name: Run tests
        run: |
          set -o pipefail
          "./build-ci-host/${{ matrix.version }}/3dalpha_tests" 2>&1 | tee test.log

      # Runs on failure too -- the tail is the useful part when it is red.
      - name: Report results
        if: always()
        run: |
          {
            echo "### ${{ matrix.version }} host tests"
            echo '```'
            tail -n 20 test.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [versions, test]
    runs-on: ubuntu-latest
    # devkitARM, libctru, citro3d, citro2d, picasso, 3dsxtool and 3ds-zlib all
    # come with the image; Debian 12 underneath supplies python3 and cmake.
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # actions/checkout leaves the workspace owned by a different uid than the
      # container's root, which git refuses to operate on without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # devkitPro does not ship makerom (see docs/toolchain-setup.md), and the
      # prebuilt release binary is linked against glibc 2.38 while this image is
      # Debian 12 (2.36) -- so it is built from source at a pinned tag. It takes
      # about two seconds.
      - name: Build makerom
        run: |
          git clone --depth 1 --branch makerom-v0.19.0 \
            https://github.com/3DSGuy/Project_CTR.git /tmp/project_ctr
          make -C /tmp/project_ctr/makerom deps -j"$(nproc)"
          make -C /tmp/project_ctr/makerom -j"$(nproc)"
          install -m755 /tmp/project_ctr/makerom/bin/makerom /usr/local/bin/makerom
          makerom 2>&1 | head -2 || true

      # A build with no Vorbis decoder still succeeds and the console is simply
      # silent -- audio is never a startup dependency, see docs/assets.md -- so
      # the failure mode this step guards against is a quietly mute artifact,
      # not a broken compile. That is why it ends in `test -f`: the assertion is
      # the point, and it is what fails the run.
      #
      # The install is only a fallback. devkitpro/devkitarm:latest already ships
      # 3ds-libvorbisidec and 3ds-libogg, and pkg.devkitpro.org sits behind
      # Cloudflare, which answers Actions runners with a 403 often enough that
      # an unconditional `dkp-pacman -Sy` was failing builds that had both
      # libraries all along.
      - name: Ensure the Vorbis decoder is present
        run: |
          libs="$DEVKITPRO/portlibs/3ds/lib"
          if [ -f "$libs/libvorbisidec.a" ] && [ -f "$libs/libogg.a" ]; then
            echo "3ds-libvorbisidec and 3ds-libogg are already in the image"
          else
            dkp-pacman -Sy --noconfirm --needed 3ds-libvorbisidec
          fi
          test -f "$libs/libvorbisidec.a"
          test -f "$libs/libogg.a"

      # Not `make VERSION=...`: the Makefile builds into build/<version>/, and
      # that directory is committed to the repo with a CMakeCache.txt full of
      # absolute paths from a developer's machine. CMake would refuse it.
      - name: Configure
        run: |
          "$DEVKITPRO/portlibs/3ds/bin/arm-none-eabi-cmake" \
            -S . -B "build-ci/${{ matrix.version }}" \
            -DMCVER="${{ matrix.version }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build 3DSX
        run: cmake --build "build-ci/${{ matrix.version }}" -j"$(nproc)"

      # Separate target, and it does not imply the 3dsx -- both are built.
      - name: Build CIA
        run: cmake --build "build-ci/${{ matrix.version }}" --target cia

      # A 3DSX Luma's loader would reject is indistinguishable on hardware from
      # a crash, so the file is checked here rather than on the console.
      - name: Check the 3DSX would load
        run: python3 tools/check3dsx.py "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.3dsx"

      # docs/build-versions.md asks for this: cross-version code growth should
      # be a number in the build log, not a surprise on a console with 64 MB.
      - name: Report code size
        run: |
          {
            echo "### ${{ matrix.version }} sections"
            echo '```'
            "$DEVKITARM/bin/arm-none-eabi-size" -A -d \
              "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.elf" \
              | grep -E "^(section|\.text|\.rodata|\.data|\.bss|Total)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the build
        id: name
        run: |
          name="3DAlphaR${{ github.run_number }}${{ matrix.version }}"
          mkdir -p dist
          cp "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.3dsx" "dist/$name.3dsx"
          cp "build-ci/${{ matrix.version }}/3DAlpha-${{ matrix.version }}.cia"  "dist/$name.cia"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name"
            echo '```'
            (cd dist && sha256sum "$name.3dsx" "$name.cia")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/${{ steps.name.outputs.name }}.3dsx
            dist/${{ steps.name.outputs.name }}.cia
          if-no-files-found: error
